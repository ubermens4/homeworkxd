{% extends 'base.html' %}

{% block title %}{% if task %}Редактировать задачу{% else %}Новая задача{% endif %} — {{ project.name }}{% endblock %}

{% block content %}
<div class="mb-3">
    <a href="{{ url_for('project_detail', project_id=project.id) }}" class="text-muted small">← {{ project.name }}</a>
    <h1 class="h3 mt-1">{% if task %}Редактировать задачу{% else %}Новая задача{% endif %}</h1>
</div>

<div class="card shadow-sm" style="max-width: 600px;">
    <div class="card-body">
        <form method="post" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Название <span class="text-danger">*</span></label>
                <input type="text" id="name" name="name" class="form-control"
                       value="{{ task.name if task else '' }}"
                       placeholder="Что нужно сделать?" required autofocus>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Описание</label>
                <textarea id="description" name="description" class="form-control" rows="2"
                          placeholder="Подробности...">{{ task.description if task else '' }}</textarea>
            </div>

            <div class="row g-3 mb-3">
                <div class="col">
                    <label for="status" class="form-label">Статус</label>
                    <select id="status" name="status" class="form-select">
                        {% for s in ['Новая', 'В работе', 'На проверке', 'Завершена'] %}
                            <option value="{{ s }}" {{ 'selected' if (task and task.status == s) or (not task and s == 'Новая') }}>{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col">
                    <label for="priority" class="form-label">Приоритет</label>
                    <select id="priority" name="priority" class="form-select">
                        {% for p in ['Низкий', 'Средний', 'Высокий'] %}
                            <option value="{{ p }}" {{ 'selected' if (task and task.priority == p) or (not task and p == 'Средний') }}>{{ p }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="mb-3">
                <label for="assignee" class="form-label">Исполнитель</label>
                <input type="text" id="assignee" name="assignee" class="form-control"
                       value="{{ task.assignee if task else '' }}"
                       placeholder="Имя сотрудника">
            </div>

            <div class="d-flex gap-2 justify-content-end">
                <a href="{{ url_for('project_detail', project_id=project.id) }}" class="btn btn-secondary">Отмена</a>
                <button type="submit" class="btn btn-primary">
                    {% if task %}Сохранить{% else %}Добавить{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
